[project]
name = "exp-monitor"
version = "0.1.0"
description = "Local live dashboard for long-running experiments, with the rig's hardware sensors alongside"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# stdlib otherwise; NVML ships with the NVIDIA driver, this is only its Python binding
dependencies = ["nvidia-ml-py>=12"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
exp-monitor = "exp_monitor.cli:main"
exp-monitor-fake = "exp_monitor.fake:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
