[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-monitor"
version = "0.1.0"
description = "A config-driven hardware monitor dashboard with temperature gauges scaled to manufacturer limits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["nvidia-ml-py>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pc-monitor = "pc_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["pc_monitor*"]

[tool.setuptools.package-data]
pc_monitor = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
